name: Dripify aggregate stats sync

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: write

concurrency:
  group: dripify-aggregate-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch sanitized campaign statistics
        env:
          DRIPIFY_API_KEY: ${{ secrets.DRIPIFY_API_KEY }}
        run: python scripts/sync_dripify.py
      - name: Commit aggregate snapshot only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dripify-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh aggregate Dripify campaign stats"
            git push
          fi
